name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Headless CI has no OS keyring; use the 0600 key-file fallback.
  NK_DISABLE_KEYRING: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: test ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest        # macOS 26 arm64 (standard runner)
          - macos-26-intel      # macOS 26 x86_64
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install from the lockfile
        run: uv sync --extra gui --python ${{ matrix.python }}
      - name: Run tests
        run: uv run --no-sync pytest -q

  test-fedora:
    name: test fedora
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt system libraries
        run: |
          dnf -y install \
            python3 python3-pip binutils \
            libxkbcommon libxkbcommon-x11 \
            glib2 libicu fontconfig freetype harfbuzz \
            libX11 libXext libXrender libXi libXrandr libXcursor libXinerama \
            libXcomposite libXdamage libXfixes libxcb xcb-util xcb-util-wm \
            xcb-util-keysyms xcb-util-image xcb-util-renderutil \
            mesa-libGL mesa-libEGL libglvnd \
            xkeyboard-config
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install from the lockfile
        run: uv sync --extra gui
      - name: Run tests
        run: uv run --no-sync pytest -q

  lint:
    name: syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Byte-compile every module
        run: python -m compileall -q noknowledge nk_gui.py nk_server.py scripts
      - name: Verify the lockfile is committed and current
        run: |
          test -f uv.lock || { echo "::error::uv.lock is missing"; exit 1; }
      - name: Verify no legacy stack remains
        run: |
          if ls src-tauri package.json vite.config.js 2>/dev/null; then
            echo "::error::Rust/Node tooling must not exist in this repository"; exit 1
          fi