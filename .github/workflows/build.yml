name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    name: linux x86_64 (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install from the lockfile
        run: uv sync --extra gui --extra build --python 3.13
      - name: Build
        run: uv run --no-sync python scripts/build.py --all
      - name: Smoke-test the server binary
        run: ./dist/nk-server --help
      - uses: actions/upload-artifact@v4
        with:
          name: noknowledge-linux-x86_64
          path: dist/*
          if-no-files-found: error

  fedora:
    name: linux x86_64 (fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt system libraries
        run: |
          dnf install -y mesa-libGL libxkbcommon libxkbcommon-x11
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install from the lockfile
        run: uv sync --extra gui --extra build
      - name: Build
        run: uv run --no-sync python scripts/build.py --all
      - name: Smoke-test the server binary
        run: ./dist/nk-server --help
      - uses: actions/upload-artifact@v4
        with:
          name: noknowledge-fedora-x86_64
          path: dist/*
          if-no-files-found: error

  windows:
    name: windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install from the lockfile
        run: uv sync --extra gui --extra build --python 3.13
      - name: Build
        run: uv run --no-sync python scripts/build.py --all
      - name: Smoke-test the server binary
        run: .\dist\nk-server.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: noknowledge-windows-x86_64
          path: dist/*
          if-no-files-found: error

  macos-arm64:
    name: macos arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install from the lockfile
        run: uv sync --extra gui --extra build --python 3.13
      - name: Build
        run: uv run --no-sync python scripts/build.py --all
      - name: Smoke-test the server binary
        run: ./dist/nk-server --help
      - uses: actions/upload-artifact@v4
        with:
          name: noknowledge-macos-arm64
          path: dist/*
          if-no-files-found: error

  macos-intel:
    name: macos x86_64 (macos-26-intel)
    # NOTE: every Intel macOS image is a "larger runner" label, which requires a
    # paid GitHub plan. On an account without larger runners this job will not
    # schedule; drop it or self-host an Intel macOS runner in that case.
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Confirm we are on Intel
        run: python -c "import platform; assert platform.machine() == 'x86_64', platform.machine()"
      - name: Install from the lockfile
        run: uv sync --extra gui --extra build --python 3.13
      - name: Build
        run: uv run --no-sync python scripts/build.py --all
      - name: Smoke-test the server binary
        run: ./dist/nk-server --help
      - uses: actions/upload-artifact@v4
        with:
          name: noknowledge-macos-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    name: attach artifacts to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, fedora, windows, macos-arm64, macos-intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -maxdepth 3 -type f -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true