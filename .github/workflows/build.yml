name: Build

on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

jobs:
  linux:
    name: linux x86_64 (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install from the lockfile
        run: uv sync --extra gui --extra build --python 3.13
      - name: Build
        run: uv run --no-sync python scripts/build.py --all
      - name: Smoke-test the server binary
        run: ./dist/nk-server --help
      - uses: actions/upload-artifact@v4
        with:
          name: noknowledge-linux-x86_64
          path: dist/*
          if-no-files-found: error

  fedora:
    name: linux x86_64 (fedora)
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt system libraries
        run: |
          dnf -y install \
            python3 python3-pip binutils \
            libxkbcommon libxkbcommon-x11 \
            glib2 libicu fontconfig freetype harfbuzz \
            libX11 libXext libXrender libXi libXrandr libXcursor libXinerama \
            libXcomposite libXdamage libXfixes libxcb xcb-util xcb-util-wm \
            xcb-util-keysyms xcb-util-image xcb-util-renderutil \
            mesa-libGL mesa-libEGL libglvnd \
            libpng libjpeg-turbo libzstd xz \
            xkeyboard-config
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install from the lockfile
        run: uv sync --extra gui --extra build
      - name: Build
        run: uv run --no-sync python scripts/build.py --all
      - name: Smoke-test the server binary
        run: ./dist/nk-server --help
      - uses: actions/upload-artifact@v4
        with:
          name: noknowledge-fedora-x86_64
          path: dist/*
          if-no-files-found: error

  windows:
    name: windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install from the lockfile
        run: uv sync --extra gui --extra build --python 3.13
      - name: Build
        run: uv run --no-sync python scripts/build.py --all
      - name: Smoke-test the server binary
        run: .\dist\nk-server.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: noknowledge-windows-x86_64
          path: dist/*
          if-no-files-found: error

  macos-arm64:
    name: macos arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install macOS OpenSSL
        # Without a Homebrew OpenSSL 3, PyInstaller bundles the system LibreSSL
        # and the frozen binary dies on `_SSL_get0_group_name` from cryptography.
        run: brew install openssl@3
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install from the lockfile
        run: uv sync --extra gui --extra build --python 3.13
      - name: Build
        run: uv run --no-sync python scripts/build.py --all
      - name: Smoke-test the server binary
        run: ./dist/nk-server --help
      - uses: actions/upload-artifact@v4
        with:
          name: noknowledge-macos-arm64
          path: dist/*
          if-no-files-found: error

  macos-intel:
    name: macos x86_64 (macos-26-intel)
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Confirm we are on Intel
        run: python -c "import platform; assert platform.machine() == 'x86_64', platform.machine()"
      - name: Install macOS OpenSSL
        # See the arm64 job: the system LibreSSL lacks symbols cryptography needs.
        run: brew install openssl@3
      - name: Install from the lockfile
        run: uv sync --extra gui --extra build --python 3.13
      - name: Build
        run: uv run --no-sync python scripts/build.py --all
      - name: Smoke-test the server binary
        run: ./dist/nk-server --help
      - uses: actions/upload-artifact@v4
        with:
          name: noknowledge-macos-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    name: attach artifacts to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, fedora, windows, macos-arm64, macos-intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Delete assets from an earlier build of this tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            try {
              const release = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag,
              });
              for (const asset of release.data.assets) {
                await github.rest.repos.deleteReleaseAsset({
                  ...context.repo, asset_id: asset.id,
                });
                core.info(`Deleted stale asset: ${asset.name}`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info(`No release exists for ${tag} yet.`);
            }
      - name: Package one archive per platform
        run: |
          set -euo pipefail
          mkdir -p release
          # Binaries share names across platforms (nk-gui, nk-gui.exe, .app
          # bundles), so archive each platform separately instead of copying
          # files into one flat directory where they would overwrite each other.
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            ( cd "$dir" && zip -qr "../${name}.zip" . )
          done
          find artifacts -maxdepth 1 -name '*.zip' -exec mv {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true