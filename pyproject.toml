[project]
name = "noknowledge"
version = "1.0.0"
description = "Zero-knowledge, federated, capability-mailbox messenger in pure Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # cryptography 49+ ships arm64-only macOS wheels, which forces a source
    # build on Intel macOS and leaves PyInstaller with a mismatched OpenSSL
    # (the frozen binary then dies on _SSL_get0_group_name). 48 and below still
    # publish universal2 wheels, so cap below 49 to keep macos-26-intel working.
    "cryptography>=42.0.0,<49",
    "mnemonic>=0.21",
    "requests>=2.31.0",
    "PySocks>=1.7.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "keyring>=24.0.0",
]

[project.optional-dependencies]
# Desktop client. Without it, the core library, relay and tests still work;
# GUI tests skip themselves.
gui = [
    "PyQt5>=5.15.10",
    # Riverbank publishes no Windows wheel of PyQt5-Qt5 above 5.15.2, and 5.15.2
    # has no Apple-silicon wheel. Pin each platform on its side of 5.15.2 so uv
    # forks the lock instead of unifiying on a version one platform cannot use.
    "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
    "PyQt5-Qt5>5.15.2; sys_platform != 'win32'",
]
# Standalone binaries.
build = ["pyinstaller>=6.6.0"]

# Installed by `uv sync` (the default group), so `uv run pytest` just works.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
nk-server = "noknowledge.server.__main__:main"
nk-gui = "noknowledge.gui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noknowledge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
